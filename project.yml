name: Unproc
options:
  bundleIdPrefix: lol.peril.unproc
  deploymentTarget:
    iOS: "26.0"
  createIntermediateGroups: true
  xcodeVersion: "26.0"
settings:
  base:
    SWIFT_VERSION: "5.0"
    MARKETING_VERSION: "1.0.0"
    CURRENT_PROJECT_VERSION: "1"
    TARGETED_DEVICE_FAMILY: "1"
    IPHONEOS_DEPLOYMENT_TARGET: "26.0"
    ENABLE_USER_SCRIPT_SANDBOXING: YES
    DEAD_CODE_STRIPPING: YES
    CODE_SIGN_STYLE: Automatic
    DEVELOPMENT_TEAM: ""
targets:
  Unproc:
    type: application
    platform: iOS
    sources:
      - path: Unproc/App
      - path: Unproc/Shared
      - path: Unproc/Intents
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: lol.peril.unproc
        PRODUCT_NAME: Unproc
        INFOPLIST_FILE: Unproc/App/Info.plist
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        ASSETCATALOG_COMPILER_GLOBAL_ACCENT_COLOR_NAME: AccentColor
        SWIFT_ACTIVE_COMPILATION_CONDITIONS: $(inherited) UNPROC_APP
    dependencies:
      - target: UnprocCapture
      - target: UnprocWidgets
  UnprocCapture:
    type: extensionkit-extension
    platform: iOS
    sources:
      - path: Unproc/CaptureExtension
      - path: Unproc/Shared
      - path: Unproc/Intents
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: lol.peril.unproc.capture
        PRODUCT_NAME: UnprocCapture
        INFOPLIST_FILE: Unproc/CaptureExtension/Info.plist
        APPLICATION_EXTENSION_API_ONLY: YES
        SWIFT_ACTIVE_COMPILATION_CONDITIONS: $(inherited) UNPROC_EXTENSION
  UnprocWidgets:
    type: app-extension
    platform: iOS
    sources:
      - path: Unproc/Widgets
      - path: Unproc/Intents
      - path: Unproc/Shared/Core/Settings.swift
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: lol.peril.unproc.widgets
        PRODUCT_NAME: UnprocWidgets
        INFOPLIST_FILE: Unproc/Widgets/Info.plist
        APPLICATION_EXTENSION_API_ONLY: YES
        SWIFT_ACTIVE_COMPILATION_CONDITIONS: $(inherited) UNPROC_WIDGETS
schemes:
  Unproc:
    build:
      targets:
        Unproc: all
        UnprocCapture: all
        UnprocWidgets: all
    run:
      config: Debug
    archive:
      config: Release
