name: Unproc
options:
  bundleIdPrefix: lol.peril.unproc
  deploymentTarget:
    iOS: "26.0"
  createIntermediateGroups: true
  xcodeVersion: "26.0"
packages:
  Glur:
    url: https://github.com/joogps/Glur
    from: "2.0.0"
settings:
  base:
    SWIFT_VERSION: "5.0"
    MARKETING_VERSION: "1.0.0"
    CURRENT_PROJECT_VERSION: "1"
    TARGETED_DEVICE_FAMILY: "1"
    IPHONEOS_DEPLOYMENT_TARGET: "26.0"
    ENABLE_USER_SCRIPT_SANDBOXING: YES
    DEAD_CODE_STRIPPING: YES
    CODE_SIGN_STYLE: Automatic
    DEVELOPMENT_TEAM: ""
    # Every target ships a hand-written Info.plist (see INFOPLIST_FILE).
    GENERATE_INFOPLIST_FILE: NO
    SUPPORTS_MACCATALYST: NO
    SUPPORTS_MAC_DESIGNED_FOR_IPHONE_IPAD: NO
    SUPPORTS_XR_DESIGNED_FOR_IPHONE_IPAD: NO
targets:
  Unproc:
    type: application
    platform: iOS
    sources:
      - path: Unproc/App
      - path: Unproc/Shared
      - path: Unproc/Intents
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: lol.peril.unproc
        PRODUCT_NAME: Unproc
        INFOPLIST_FILE: Unproc/App/Info.plist
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        ASSETCATALOG_COMPILER_GLOBAL_ACCENT_COLOR_NAME: AccentColor
        SWIFT_ACTIVE_COMPILATION_CONDITIONS: $(inherited) UNPROC_APP
    dependencies:
      - package: Glur
        product: GlurBackdrop
      # extensionkit-extension -> "Embed ExtensionKit Extensions" phase
      # ($(EXTENSIONS_FOLDER_PATH) = Unproc.app/Extensions)
      - target: UnprocCapture
      # app-extension -> "Embed Foundation Extensions" phase (Unproc.app/PlugIns)
      - target: UnprocWidgets
  UnprocCapture:
    type: extensionkit-extension
    platform: iOS
    sources:
      - path: Unproc/CaptureExtension
      - path: Unproc/Shared
      - path: Unproc/Intents
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: lol.peril.unproc.capture
        PRODUCT_NAME: UnprocCapture
        INFOPLIST_FILE: Unproc/CaptureExtension/Info.plist
        APPLICATION_EXTENSION_API_ONLY: YES
        SKIP_INSTALL: YES
        # XcodeGen has no preset for ExtensionKit products; the bundle lives
        # at Unproc.app/Extensions/UnprocCapture.appex.
        LD_RUNPATH_SEARCH_PATHS: ["$(inherited)", "@executable_path/Frameworks", "@executable_path/../../Frameworks"]
        SWIFT_ACTIVE_COMPILATION_CONDITIONS: $(inherited) UNPROC_EXTENSION
    dependencies:
      - package: Glur
        product: GlurBackdrop
  UnprocWidgets:
    type: app-extension
    platform: iOS
    sources:
      - path: Unproc/Widgets
      - path: Unproc/Intents
      - path: Unproc/Shared/Core/Settings.swift
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: lol.peril.unproc.widgets
        PRODUCT_NAME: UnprocWidgets
        INFOPLIST_FILE: Unproc/Widgets/Info.plist
        APPLICATION_EXTENSION_API_ONLY: YES
        SKIP_INSTALL: YES
        SWIFT_ACTIVE_COMPILATION_CONDITIONS: $(inherited) UNPROC_WIDGETS
  UnprocTests:
    type: bundle.unit-test
    platform: iOS
    sources:
      - path: UnprocTests
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: lol.peril.unproc.tests
        GENERATE_INFOPLIST_FILE: YES
        TEST_HOST: $(BUILT_PRODUCTS_DIR)/Unproc.app/$(BUNDLE_EXECUTABLE_FOLDER_PATH)/Unproc
        BUNDLE_LOADER: $(TEST_HOST)
    dependencies:
      - target: Unproc
  UnprocUITests:
    type: bundle.ui-testing
    platform: iOS
    sources:
      - path: UnprocUITests
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: lol.peril.unproc.uitests
        GENERATE_INFOPLIST_FILE: YES
        TEST_TARGET_NAME: Unproc
    dependencies:
      - target: Unproc
schemes:
  Unproc:
    build:
      targets:
        Unproc: all
        UnprocCapture: all
        UnprocWidgets: all
    test:
      targets:
        - UnprocTests
        - UnprocUITests
    run:
      config: Debug
    archive:
      config: Release
